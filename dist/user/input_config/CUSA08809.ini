# Shadow of the Colossus - keyboard/mouse and controller bindings.
# Format: <PS4 pad output> = <key or controller input>. F8 reloads this file in-game.

# --- Keyboard and mouse ---
# Mouse moves the camera (right stick). F7 toggles mouse capture.
mouse_to_joystick = right
# deadzone offset, speed, speed offset
mouse_movement_params = 0.25, 2.5, 0.0
# Mouse directions turned around: x, y, xy or none.
mouse_invert = none

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s

# Game actions as the Controls screen (Modern preset) names them:
# cross JUMP, triangle CONTROL HORSE, circle ROLL, square ATTACK, R2 GRAB, R1 AIM (raise sword,
# draw bow), L2 VIEW COLOSSUS, L1 CAMERA FOCUS, d-pad up UNEQUIP, left CHANGE RANGED,
# right CHANGE SWORD, down PHOTO MODE, touchpad WORLD MAP.
cross = space
cross = enter
# E: use / pick up / pray / hold on (the game's grab button); also the mouse's back side button.
r2 = e
r2 = sidebuttonback
# Q: call Agro, and spur him on when riding. Left Shift spurs too.
triangle = q
triangle = lshift
# Left Shift switches between running and walking.
walk_toggle = lshift
# C: crouch and roll.
circle = c
circle = lctrl
circle = backspace
# Left mouse: attack; with the bow, draw (hold) and shoot (release).
square_or_bow = leftbutton
# Right mouse: grab, hold on and climb. Middle mouse: raise the sword to the light (not with the bow out).
r2 = rightbutton
sword_light = middlebutton
# R: turn the camera to the colossus.
l2 = r
l1 = z
l3 = v
r3 = f

pad_up = up
pad_down = down
pad_left = left
pad_right = right
pad_right = mousewheeldown
pad_left = mousewheelup
pad_right = 1
pad_left = 2
pad_up = x
pad_down = p

options = escape
touchpad_center = tab

# --- Controller (Xbox, DualShock, DualSense, Switch Pro via SDL) ---
triangle = triangle
cross = cross
square = square
circle = circle
l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3
options = options
touchpad_center = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127
